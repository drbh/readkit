[package]
name = "readkit-sra"
description = ".sra decoding into readkit batches with typed SRA Lite detection, and optional accession resolution"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
## Accession resolution (`Resolver`): ENA metadata and NCBI S3 probes over
## HTTPS through readkit-fetch. Off by default so that decoding local `.sra`
## files pulls in no HTTP stack.
resolve = ["dep:readkit-fetch", "dep:serde_json"]
## In-process decoding through the NCBI VDB library shipped with the SRA
## Toolkit (`libncbi-ngs`). Set `NGS_PREFIX` if it is not under `/opt/homebrew`.
ngs = ["dep:cc", "dep:libdeflater"]

[dependencies]
readkit-batch.workspace = true
readkit-io.workspace = true
readkit-fastq.workspace = true
readkit-fetch = { workspace = true, optional = true }
serde_json = { version = "1", optional = true }
libdeflater = { version = "1.26", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
readkit-fetch.workspace = true
serde_json = "1"

[build-dependencies]
cc = { version = "1", optional = true }

[[test]]
name = "resolve"
required-features = ["resolve"]

[package.metadata.docs.rs]
all-features = true
# The ngs shim uses pthreads.
targets = ["x86_64-unknown-linux-gnu"]

[[bench]]
name = "decode"
harness = false
required-features = ["ngs"]
