[package]
name = "readkit-fetch"
description = "Ranged, verified, resumable HTTP downloads with file, memory and in-order stream sinks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
blake3 = "1.8"
md-5 = "0.11"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.47", features = ["rt-multi-thread", "sync", "time", "net"] }

[[bench]]
name = "fetch"
harness = false
